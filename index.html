let activeSem = 2;

function badgeClass(type){
  return {Core:'b-core',Foundation:'b-fnd',AEC:'b-aec',SEC:'b-sec',VAC:'b-vac','Multi-disciplinary':'b-multi'}[type]||'b-fnd';
}

function renderNav(){
  const nav = document.getElementById('sem-nav');
  nav.innerHTML = SEMS.map(s=>`
    <button class="sem-btn${s.id===activeSem?' active':''}" onclick="switchSem(${s.id})">
      <span>Semester ${s.id}</span>
      <span class="credits-hint">${s.credits}cr</span>
    </button>
  `).join('');
}

function switchSem(id){
  activeSem=id;
  renderNav();
  renderMain();
}

function renderCourseCard(c, showFullSyl){
  const badgeTyp = badgeClass(c.type);
  const ltpLabel = c.ltp || '';
  const hasSyl = showFullSyl && (c.modules||c.experiments);
  const isCommon = c.syl==='common';
  const id = 'c-'+c.code.replace(/[^a-zA-Z0-9]/g,'_');
  return `
    <div class="course-card" id="${id}">
      <div class="course-head" onclick="toggleCard('${id}')">
        <div>
          <div class="c-code">${c.code} · ${ltpLabel}</div>
          <div class="c-name">${c.name}</div>
          <div class="badges">
            <span class="badge ${badgeTyp}">${c.type}</span>
            ${c.ec?'<span class="badge b-ec">EC-Council</span>':''}
            <span class="badge b-cr">${c.cr} cr</span>
          </div>
        </div>
        <span class="c-toggle" id="${id}-toggle">+</span>
      </div>
      <div class="c-body" id="${id}-body">
        <div class="c-inner">
          ${hasSyl ? renderSyllabus(c) : isCommon ? '<div class="syl-common">Syllabus included in common course documentation — not part of specialization document.</div>' : '<div class="syl-na">Syllabus will be available when this semester begins.</div>'}
        </div>
      </div>
    </div>
  `;
}

function renderSyllabus(c){
  let html = '<div class="syl-lbl">Course Outcomes</div><div class="cos">';
  (c.cos||[]).forEach((co,i)=>{ html+=`<div class="co"><span class="co-k">CO${i+1}</span><span>${co}</span></div>` });
  html+='</div>';
  if(c.modules){
    html+='<div class="syl-lbl" style="margin-top:1rem">Syllabus Modules</div><div class="mods">';
    c.modules.forEach(m=>{
      html+=`<div class="mod"><span class="mod-n">${m.n}</span><div><div class="mod-title">${m.title}</div><div class="mod-topics">${m.topics}</div></div></div>`;
    });
    html+='</div>';
  }
  if(c.experiments){
    html+='<div class="syl-lbl" style="margin-top:1rem">Lab Experiments</div><div class="exps">';
    c.experiments.forEach((e,i)=>{
      html+=`<div class="exp"><span class="exp-n">E${i+1}</span><span>${e}</span></div>`;
    });
    html+='</div>';
  }
  return html;
}

function toggleCard(id){
  const body = document.getElementById(id+'-body');
  const tog = document.getElementById(id+'-toggle');
  const open = body.classList.toggle('open');
  tog.classList.toggle('open', open);
}

function renderCalendar(dates){
  const rows = dates.map(d=>`
    <div class="tl-item">
      <span class="tl-dot ${d.dot}"></span>
      <div class="tl-info">
        <div class="tl-date">${d.date}</div>
        <div class="tl-label ${d.dot}">${d.label}</div>
      </div>
    </div>
  `).join('');
  return `
    <div class="cal-card">
      <div class="cal-head">
        <div class="cal-title">Academic Calendar — Semester 2</div>
        <div class="cal-note">Even semester · 1st year · 84 teaching days</div>
      </div>
      <div class="timeline">${rows}</div>
    </div>
  `;
}

function renderMain(){
  const sem = SEMS.find(s=>s.id===activeSem);
  const main = document.getElementById('main-content');
  const statusLabel = {completed:'Completed',current:'In Progress',upcoming:'Upcoming'}[sem.status];

  let html = `
    <div class="sem-title">
      Semester ${sem.id} &nbsp;
      <span class="status-pill ${sem.status}">${statusLabel}</span>
    </div>
    <div class="sem-desc">${sem.type} Semester · ${sem.year}</div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${sem.courses.length}</div><div class="stat-lbl">Courses</div></div>
      <div class="stat"><div class="stat-val">${sem.credits}</div><div class="stat-lbl">Credits</div></div>
      <div class="stat"><div class="stat-val">${sem.teaching||'—'}</div><div class="stat-lbl">Teaching days</div></div>
      <div class="stat"><div class="stat-val">${sem.exam||'—'}</div><div class="stat-lbl">Exam days</div></div>
    </div>
  `;

  if(sem.calendarDates){
    html += renderCalendar(sem.calendarDates);
  }

  if(sem.status==='current'){
    // group by type
    const ecCore = sem.courses.filter(c=>c.ec);
    const other = sem.courses.filter(c=>!c.ec);
    html += `<div class="sec-div">Specialization — EC-Council</div>`;
    html += ecCore.map(c=>renderCourseCard(c,true)).join('');
    html += `<div class="sec-div">Common Courses</div>`;
    html += other.map(c=>renderCourseCard(c,true)).join('');
  } else if(sem.status==='completed'){
    html += `<div class="sec-div">Courses</div>`;
    const note = `<div class="empty-note">This semester has been completed. Syllabus records available with your department.</div>`;
    html += sem.courses.map(c=>renderCourseCard(c,false)).join('') + note;
  } else {
    html += `<div class="sec-div">Courses</div>`;
    html += sem.courses.map(c=>renderCourseCard(c,false)).join('');
    html += `<div class="empty-note" style="margin-top:.75rem">Detailed syllabi will be added when this semester begins.</div>`;
  }

  main.innerHTML = html;
}

renderNav();
renderMain();

const HASH = 'ae30a06c6efe2ae88421eff04626a246fbb92eb60f12b386481b38c58639d866';

function toggleDark(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const next=dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('dark-btn').textContent=next==='dark'?'\u2600':'\u{1F319}';
  localStorage.setItem('theme',next);
}
(function(){
  const saved=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  if(saved==='dark'){document.documentElement.setAttribute('data-theme','dark');setTimeout(()=>{const b=document.getElementById('dark-btn');if(b)b.textContent='\u2600';},0);}
})();

async function unlock(){
  const inp = document.getElementById('lock-input');
  const err = document.getElementById('lock-err');
  const val = inp.value;
  const encoded = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', encoded);
  const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash === HASH){
    document.getElementById('lockscreen').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    err.textContent = 'Incorrect code. Try again.';
    inp.classList.add('err');
    inp.value='';
    setTimeout(()=>inp.classList.remove('err'),400);
  }
}
